name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  linux-x11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qt6-base-dev libqt6opengl6-dev qt6-base-private-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxtst-dev \
            libxkbcommon-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist/QDesktopPet-linux-x11
          cp build/QDesktopPet dist/QDesktopPet-linux-x11/
          [ -d build/Resources ] && cp -r build/Resources dist/QDesktopPet-linux-x11/ || true
          tar czf QDesktopPet-linux-x11.tar.gz -C dist QDesktopPet-linux-x11

      - uses: actions/upload-artifact@v4
        with:
          name: QDesktopPet-linux-x11
          path: QDesktopPet-linux-x11.tar.gz

  linux-wayland:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qt6-base-dev libqt6opengl6-dev qt6-base-private-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libwayland-dev libwayland-client0 \
            libx11-dev libxext-dev libxtst-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist/QDesktopPet-linux-wayland
          cp build/QDesktopPet dist/QDesktopPet-linux-wayland/
          [ -d build/Resources ] && cp -r build/Resources dist/QDesktopPet-linux-wayland/ || true
          tar czf QDesktopPet-linux-wayland.tar.gz -C dist QDesktopPet-linux-wayland

      - uses: actions/upload-artifact@v4
        with:
          name: QDesktopPet-linux-wayland
          path: QDesktopPet-linux-wayland.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        run: brew install qt@6

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)"

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          QT_PREFIX=$(brew --prefix qt@6)
          "${QT_PREFIX}/bin/macdeployqt" build/QDesktopPet.app -libpath="${QT_PREFIX}/lib"
          cd build && zip -r ../QDesktopPet-macos-arm64.zip QDesktopPet.app

      - uses: actions/upload-artifact@v4
        with:
          name: QDesktopPet-macos-arm64
          path: QDesktopPet-macos-arm64.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: 'qtimageformats'

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $deployDir = "dist/QDesktopPet-windows"
          New-Item -ItemType Directory -Force -Path $deployDir
          Copy-Item "build/Release/QDesktopPet.exe" $deployDir/
          Copy-Item "build/Release/Live2DCubismCore.dll" $deployDir/
          if (Test-Path "build/Release/Resources") {
            Copy-Item -Recurse "build/Release/Resources" $deployDir/
          } elseif (Test-Path "build/Resources") {
            Copy-Item -Recurse "build/Resources" $deployDir/
          }
          & windeployqt --release --no-translations "$deployDir/QDesktopPet.exe"
          Compress-Archive -Path "$deployDir" -DestinationPath "QDesktopPet-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: QDesktopPet-windows-x64
          path: QDesktopPet-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x11, linux-wayland, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/QDesktopPet-linux-x11/QDesktopPet-linux-x11.tar.gz
            artifacts/QDesktopPet-linux-wayland/QDesktopPet-linux-wayland.tar.gz
            artifacts/QDesktopPet-macos-arm64/QDesktopPet-macos-arm64.zip
            artifacts/QDesktopPet-windows-x64/QDesktopPet-windows-x64.zip
