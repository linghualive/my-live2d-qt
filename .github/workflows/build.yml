name: Build

on:
  push:
    branches: [master, v3.0-rewrite]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  linux-qt6:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel cmake git \
            qt6-base mesa libx11 libxext libxtst libxkbcommon \
            wayland pkg-config

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Diagnose
        run: build/QDesktopPet --diagnose || true

      - name: Package
        run: |
          mkdir -p dist/QDesktopPet-linux-qt6
          cp build/QDesktopPet dist/QDesktopPet-linux-qt6/
          [ -d build/Resources ] && cp -r build/Resources dist/QDesktopPet-linux-qt6/ || true
          tar czf QDesktopPet-linux-qt6.tar.gz -C dist QDesktopPet-linux-qt6

      - uses: actions/upload-artifact@v4
        with:
          name: QDesktopPet-linux-qt6
          path: QDesktopPet-linux-qt6.tar.gz

  linux-qt5:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel cmake git \
            qt5-base mesa libx11 libxext libxtst libxkbcommon \
            wayland pkg-config

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Verify Qt5 selected
        run: grep -q "Using Qt5" build/CMakeFiles/CMakeOutput.log 2>/dev/null || cmake -B build 2>&1 | tee /dev/stderr | grep -q "Using Qt5"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Diagnose
        run: build/QDesktopPet --diagnose || true

      - name: Package
        run: |
          mkdir -p dist/QDesktopPet-linux-qt5
          cp build/QDesktopPet dist/QDesktopPet-linux-qt5/
          [ -d build/Resources ] && cp -r build/Resources dist/QDesktopPet-linux-qt5/ || true
          tar czf QDesktopPet-linux-qt5.tar.gz -C dist QDesktopPet-linux-qt5

      - uses: actions/upload-artifact@v4
        with:
          name: QDesktopPet-linux-qt5
          path: QDesktopPet-linux-qt5.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        run: brew install qt@6

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)"

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          QT_PREFIX=$(brew --prefix qt@6)
          "${QT_PREFIX}/bin/macdeployqt" build/QDesktopPet.app -libpath="${QT_PREFIX}/lib"
          cd build && zip -r ../QDesktopPet-macos-arm64.zip QDesktopPet.app

      - uses: actions/upload-artifact@v4
        with:
          name: QDesktopPet-macos-arm64
          path: QDesktopPet-macos-arm64.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: 'qtimageformats'

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $deployDir = "dist/QDesktopPet-windows"
          New-Item -ItemType Directory -Force -Path $deployDir
          Copy-Item "build/Release/QDesktopPet.exe" $deployDir/
          Copy-Item "build/Release/Live2DCubismCore.dll" $deployDir/
          if (Test-Path "build/Release/Resources") {
            Copy-Item -Recurse "build/Release/Resources" $deployDir/
          } elseif (Test-Path "build/Resources") {
            Copy-Item -Recurse "build/Resources" $deployDir/
          }
          & windeployqt --release --no-translations "$deployDir/QDesktopPet.exe"
          Compress-Archive -Path "$deployDir" -DestinationPath "QDesktopPet-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: QDesktopPet-windows-x64
          path: QDesktopPet-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-qt6, linux-qt5, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/QDesktopPet-linux-qt6/QDesktopPet-linux-qt6.tar.gz
            artifacts/QDesktopPet-linux-qt5/QDesktopPet-linux-qt5.tar.gz
            artifacts/QDesktopPet-macos-arm64/QDesktopPet-macos-arm64.zip
            artifacts/QDesktopPet-windows-x64/QDesktopPet-windows-x64.zip
